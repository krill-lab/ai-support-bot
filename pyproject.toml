[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-support-bot"
version = "0.1.0"
description = "A small, replayable customer-support agent: fixed workflow, read-only tools, time-aware knowledge base"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.scripts]
supportbot = "supportbot.cli:main"

[tool.setuptools]
packages = ["supportbot"]
